# Kubernetes Secrets for ApeX Barbershop
# NOTE: In production, use sealed-secrets or external secrets manager
apiVersion: v1
kind: Secret
metadata:
  name: apex-secrets
  namespace: apex-barbershop
  labels:
    app: apex-barbershop
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "your-super-secret-key-change-in-production"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "your-secure-postgres-password"
  EMAIL_HOST_USER: "your-email@gmail.com"
  EMAIL_HOST_PASSWORD: "your-email-app-password"
  GOOGLE_OAUTH2_KEY: "your-google-oauth-key"
  GOOGLE_OAUTH2_SECRET: "your-google-oauth-secret"
  AWS_ACCESS_KEY_ID: "your-aws-access-key"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-key"
  AWS_STORAGE_BUCKET_NAME: "apex-barbershop-media"
