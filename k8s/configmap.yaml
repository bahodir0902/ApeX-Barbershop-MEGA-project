# Kubernetes ConfigMap for ApeX Barbershop
apiVersion: v1
kind: ConfigMap
metadata:
  name: apex-config
  namespace: apex-barbershop
  labels:
    app: apex-barbershop
data:
  DJANGO_ENV: "production"
  ALLOWED_HOSTS: "apex-barbershop.com,www.apex-barbershop.com,api.apex-barbershop.com"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "apex_barbershop"
  REDIS_URL: "redis://redis-service:6379/0"
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/0"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"
  USE_S3: "False"
  DEBUG: "False"
